services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: telos_db
    restart: always
    environment:
      POSTGRES_DB: telos
      POSTGRES_USER: telos
      POSTGRES_PASSWORD: telos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telos -d telos"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telos_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TELOS_DB_URL: jdbc:postgresql://db:5432/telos
      TELOS_DB_USER: telos
      TELOS_DB_PASSWORD: telos
      TELOS_JWT_SECRET: telos-dev-secret-please-change-in-production-0123456789
      TELOS_CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telos_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

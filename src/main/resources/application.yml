spring:
  application:
    name: telos-backend
  datasource:
    url: ${TELOS_DB_URL}
    username: ${TELOS_DB_USER}
    password: ${TELOS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${TELOS_PORT:8080}

telos:
  jwt:
    secret: ${TELOS_JWT_SECRET}
    ttl-seconds: ${TELOS_JWT_TTL_SECONDS:86400}
  cors:
    allowed-origins: ${TELOS_CORS_ORIGINS}

logging:
  level:
    org.flywaydb: INFO
